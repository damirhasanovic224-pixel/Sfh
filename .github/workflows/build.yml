name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Get Ruffle
        run: |
          mkdir ruffle-dl && cd ruffle-dl
          npm init -y
          npm install @ruffle-rs/ruffle
          mkdir -p ../app/src/main/assets/ruffle
          cp -r node_modules/@ruffle-rs/ruffle/. ../app/src/main/assets/ruffle/
          ls ../app/src/main/assets/ruffle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Sfh-apk
          path: app/build/outputs/apk/debug/app-debug.apk
